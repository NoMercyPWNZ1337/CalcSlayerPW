<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slayer</title>

    <style>
        body {
            background-color: #151515;
            background-image: url("FinalDeskCartel.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            /* height: 100vh; */
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .item {
            font-size: 28px;
            margin: 20px 0;
            color: #ffd700;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            background: #ffd700;
            font-weight: 700;
        }

        .success {
            color: #00ff88;
            margin-top: 20px;
        }

        .fail {
            color: #ff4444;
            margin-top: 20px;
        }

        .chance {
            margin-top: 15px;
            color: #aaa;
        }

        .history {
            margin-top: 20px;
            height: 300px;
            overflow-y: auto;
            background: #151515;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
        }

        .custom-check {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        .custom-check input {
            display: none;
        }

        .checkmark {
            width: 22px;
            height: 22px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 6px;
            position: relative;
            transition: 0.2s;
        }

        .custom-check input:checked+.checkmark {
            background: linear-gradient(135deg, #00ff88, #00c3ff);
            border-color: transparent;
            box-shadow: 0 0 15px #00ff88aa;
            transform: scale(1.1);
        }

        .custom-check input:checked+.checkmark::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid black;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        label {
            margin: 0 8px;
        }

        .inventory {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .inv-title {
            text-align: center;
            font-size: 18px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .item-radio {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #151515;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2a2a2a;
        }

        .item-radio:hover {
            border-color: #00ff88;
            transform: scale(1.02);
        }

        .item-radio input {
            display: none;
        }

        /* кастом radio */
        .radio-ui {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #666;
            position: relative;
        }

        .item-radio input:checked+.radio-ui {
            border-color: #00ff88;
            box-shadow: 0 0 10px #00ff88aa;
        }

        .item-radio input:checked+.radio-ui::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .item-name {
            font-size: 16px;
            color: #fff;
        }

        .item-name span {
            color: #ffd700;
            margin-left: 6px;
        }

        .calj {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 15px;
        }

        .leaderboard {
            width: 250px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .leaderboard h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .lb-item {
            padding: 8px;
            margin: 5px 0;
            background: #151515;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }

        .auth {
            position: absolute;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .auth input {
            box-sizing: border-box;
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            background: aliceblue;
            padding-left: 10px;
        }


        .box {
            display: none;
        }

        .button-st {
            display: flex;
            justify-content: space-between;
        }

        .leaderboard {
            display: none;
        }

        .current-player {
            border: 1px solid #ffd700;
            background: rgba(255, 215, 0, 0.15);
            /* box-shadow: 0 0 12px rgba(255, 215, 0, 0.4); */
            color: #ffd700;
             animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
            }

            50% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            }

            100% {
                box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
            }
        }


        @media (max-width: 768px) {

            body {
                flex-direction: column;
                height: auto;
                padding: 20px 10px;
                gap: 15px;
                background-size: cover;
            }

            .box {
                width: 100%;
                max-width: 420px;
                padding: 20px;
            }

            .leaderboard {
                width: 100%;
                max-width: 420px;
                height: 300px;
            }

            .item {
                font-size: 22px;
            }

            button {
                width: 100%;
                font-size: 16px;
            }

            .calj {
                flex-direction: column;
                align-items: center;
            }

            .auth {
                width: 90%;
                max-width: 350px;
            }

            html,
            body {
                overflow-x: hidden;
            }

            button {
                min-height: 44px;
            }

        }
    </style>
</head>

<body>

    <div class="auth" id="authBox">

        <h2>ЗАРЕЄСТРУЙСА І АВТОРИЗУЙСА, ФРАЄРОК</h2>

        <input id="nickname" placeholder="Login" />
        <input id="password" placeholder="Password" type="password" />

        <div class="button-st" style="margin-top:10px;">
            <button onclick="login()">Авторизація</button>
            <button onclick="register()">Реєстрація</button>
        </div>

    </div>
    <div class="box">

        <h1>Slayer PWNZ Заточка</h1>

        <div class="item">
            Шмотка: <span id="level">+0</span>
        </div>

        <!-- 3 шмотки -->
        <!-- <div style="margin-top:10px;">
        <div>Вибір шмотки:</div>

        <label><input type="radio" name="item" value="0" checked> Шмотка 1</label>
        <label><input type="radio" name="item" value="1"> Шмотка 2</label>
        <label><input type="radio" name="item" value="2"> Шмотка 3</label>
    </div> -->

        <div class="inventory">

            <div class="inv-title">Інвентар</div>

            <label class="item-radio">
                <input type="radio" name="item" value="0" checked>
                <span class="radio-ui"></span>
                <span class="item-name">
                    Шмотка 1 <span id="lvl0">+0</span>
                </span>
            </label>

            <label class="item-radio">
                <input type="radio" name="item" value="1">
                <span class="radio-ui"></span>
                <span class="item-name">
                    Шмотка 2 <span id="lvl1">+0</span>
                </span>
            </label>

            <label class="item-radio">
                <input type="radio" name="item" value="2">
                <span class="radio-ui"></span>
                <span class="item-name">
                    Шмотка 3 <span id="lvl2">+0</span>
                </span>
            </label>

        </div>

        <div class="calj">
            <label class="custom-check">
                <input type="checkbox" id="heavenStone">
                <span class="checkmark"></span>
                Нєбєска
            </label>
            <!-- <label class="custom-check">
                <input type="checkbox" id="dragonOrb">
                <span class="checkmark"></span>
                Шар Дракона
            </label> -->
        </div>


        <div class="chance" id="chanceText">Шанс: 50%</div>

        <button onclick="refine()">Заточити</button>

        <div class="history" id="history"></div>

    </div>

    <div class="leaderboard" id="leaderboard">
        <h3>Атець заточкі єбать</h3>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        //-------------------- NoMercyPWNZ1337's Project
        //-------------------- https://czfzowtkkgigfqgvbqid.supabase.co/rest/v1/users
        //--------------------  e2h@B?kb6DAMr?z ------------------------

        const supabaseUrl = "https://czfzowtkkgigfqgvbqid.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6Znpvd3Rra2dpZ2ZxZ3ZicWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NDYzNDAsImV4cCI6MjA5NTUyMjM0MH0.zgCChQxF7VAFHT08KLC0ZhGYMGEwmdd3qtq8ObDN5zI";

        const client = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        async function loginUser(nickname, password) {

            const { data, error } = await client
                .from("users")
                .select("*")
                .eq("nickname", nickname)
                .eq("password", password)
                .single();

            if (error || !data) {
                console.log("Login failed", error);
                return;
            }

            currentUser = data;

            console.log("Logged in:", currentUser);

            loadProgress();
            loadLeaderboard();
        }
        // let items = [
        //     { name: "Шмотка 1", level: 0 },
        //     { name: "Шмотка 2", level: 0 },
        //     { name: "Шмотка 3", level: 0 }
        // ];
        let items = [
            { name: "Шмотка 1", level: 0, maxLevel: 0 },
            { name: "Шмотка 2", level: 0, maxLevel: 0 },
            { name: "Шмотка 3", level: 0, maxLevel: 0 }
        ];

        let selectedItem = 0;
        let rngSeed = Date.now() % 100000;

        const mirageChances = {
            1: 50, 2: 30, 3: 30, 4: 30, 5: 30,
            6: 30, 7: 30, 8: 30, 9: 25, 10: 20,
            11: 12, 12: 5
        };

        const heavenChances = {
            1: 65, 2: 45, 3: 45, 4: 45, 5: 45,
            6: 45, 7: 45, 8: 45, 9: 40, 10: 35,
            11: 27, 12: 20
        };

        function pwRandom() {

            rngSeed =
                (rngSeed * 9301 + 49297) % 233280;

            return (rngSeed / 233280) * 100;
        }

        function getChance(level) {

            // let dragon = document.getElementById("dragonOrb").checked;
            // if (dragon) return 100;

            let heaven = document.getElementById("heavenStone").checked;

            return heaven ? heavenChances[level] : mirageChances[level];
        }

        function getCurrentItem() {
            return items[selectedItem];
        }

        function updateUI() {
            let item = getCurrentItem();
            document.getElementById("level").innerText = "+" + item.level;
            updateChanceText();
            updateLevelsUI();
        }

        function updateChanceText() {

            let item = getCurrentItem();
            let nextLevel = item.level + 1;

            if (nextLevel > 12) {
                document.getElementById("chanceText").innerText =
                    "ЄБАААТЬ +12 ЧЄЛ";
                return;
            }

            let chance = getChance(nextLevel);

            document.getElementById("chanceText").innerText =
                "Шанс: " + chance + "%";
        }

        function refine() {

            let item = getCurrentItem();

            if (item.level >= 12) {
                addHistory(`<div class="success">${item.name} ЄБАААТЬ +12 ЧЄЛ</div>`);
                return;
            }

            let nextLevel = item.level + 1;
            let chance = getChance(nextLevel);
            // let random = Math.random() * 100;
            rngSeed += Date.now() % 100;
            let random = pwRandom();

            // if (random < chance) {

            //     item.level++;

            //     addHistory(`<div class="success">${item.name} Заточив фраєрок до +${item.level}</div>`);

            // } else {

            //     item.level = 0;

            //     addHistory(`<div class="fail">${item.name} ЗБИВ ФРАЄРОК ДО +0</div>`);
            // }

            if (random < chance) {

                item.level++;

                if (item.level > item.maxLevel) {
                    item.maxLevel = item.level;
                }

                addHistory(`<div class="success">${item.name} Заточив до +${item.level}</div>`);

            } else {

                item.level = 0;

                addHistory(`<div class="fail">${item.name} ЗБИВ ДО +0</div>`);
            }

            updateUI();
            updateLevelsUI();
            saveProgress();
            loadLeaderboard();
        }

        function addHistory(text) {
            const history = document.getElementById("history");

            const div = document.createElement("div");
            div.innerHTML = text;

            history.appendChild(div);

            history.scrollTo({
                top: history.scrollHeight,
                behavior: "smooth"
            });
        }

        // вибір шмотки
        document.querySelectorAll('input[name="item"]').forEach(radio => {
            radio.addEventListener("change", (e) => {
                selectedItem = parseInt(e.target.value);
                rngSeed += (selectedItem + 1) * 777;
                updateUI();
            });
        });
        function updateLevelsUI() {
            items.forEach((item, index) => {
                const el = document.getElementById("lvl" + index);
                if (el) {
                    el.innerText = "+" + item.level;
                }
            });
        }

        // чекбокс
        document.getElementById("heavenStone").addEventListener("change", function () {
            updateChanceText();
        });
        // document.getElementById("heavenStone").addEventListener("change", function () {
        //     document.getElementById("dragonOrb").checked = false;
        //     updateChanceText();
        // });

        // document.getElementById("dragonOrb").addEventListener("change", function () {
        //     document.getElementById("heavenStone").checked = false;
        //     updateChanceText();
        // });
        // document.getElementById("dragonOrb").addEventListener("change", function () {
        //     if (this.checked) {
        //         document.getElementById("heavenStone").checked = false;
        //     }
        //     updateChanceText();
        // });

        // document.getElementById("heavenStone").addEventListener("change", function () {
        //     if (this.checked) {
        //         document.getElementById("dragonOrb").checked = false;
        //     }
        //     updateChanceText();
        // });
        function loadProgress() {

            items.forEach(item => {
                item.level = 0;
                item.maxLevel = currentUser.max_enchant; // тільки рекорд
            });

            updateUI();
        }
        async function saveProgress() {

            if (!currentUser) return;

            const maxLevel = Math.max(...items.map(i => i.maxLevel));

            const { error } = await client
                .from("users")
                .update({ max_enchant: maxLevel })
                .eq("id", currentUser.id);

            if (error) {
                console.log("Save error:", error);
            }
        }

        async function loadLeaderboard() {

            const { data, error } = await client
                .from("users")
                .select("nickname, max_enchant")
                .order("max_enchant", { ascending: false })
                .limit(10);

            if (error) {
                console.log(error);
                return;
            }

            const lb = document.getElementById("leaderboard");
            lb.innerHTML = "<h3>Атець заточкі єбать</h3>";

            data.forEach((user, index) => {

                const div = document.createElement("div");
                div.className = "lb-item";
                if (currentUser && user.nickname === currentUser.nickname) {
                    div.classList.add("current-player");
                }

                div.innerHTML = `
            <span>${index + 1}. ${user.nickname}</span>
            <span>+${user.max_enchant}</span>
        `;

                lb.appendChild(div);
            });
        }
        async function registerUser(nickname, password) {

            const { error } = await client
                .from("users")
                .insert([
                    {
                        nickname,
                        password,
                        max_enchant: 0
                    }
                ]);

            if (error) {
                console.log("Register error:", error);
                return;
            }

            console.log("Registered!");
        }
        function showGame() {
            document.getElementById("authBox").style.display = "none";
            document.querySelector(".box").style.display = "block";
            document.getElementById("leaderboard").style.display = "block";
            initGame();
        }
        async function login() {

            const nickname = document.getElementById("nickname").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!nickname || !password) {
                alert("Введи логін і пароль");
                return;
            }

            const { data, error } = await client
                .from("users")
                .select("*")
                .eq("nickname", nickname)
                .eq("password", password)
                .single();

            if (error || !data) {
                alert("Невірний логін або пароль");
                return;
            }

            currentUser = data;

            loadProgress();
            loadLeaderboard();
            showGame();
        }

        async function register() {

            const nickname = document.getElementById("nickname").value.trim();
            const password = document.getElementById("password").value.trim();

            // 🔴 перевірка порожніх полів
            if (!nickname || !password) {
                alert("Введи логін і пароль");
                return;
            }

            // 🔴 мінімальна довжина
            if (nickname.length < 3) {
                alert("Логін має бути мінімум 3 символи");
                return;
            }

            if (password.length < 4) {
                alert("Пароль має бути мінімум 4 символи");
                return;
            }

            const { error } = await client
                .from("users")
                .insert([
                    {
                        nickname,
                        password,
                        max_enchant: 0
                    }
                ]);

            if (error) {
                alert("Такий логін вже існує або помилка");
                return;
            }

            alert("Акаунт створено! Тепер увійди.");
        }

        updateUI();
        function updateAllUI() {
            updateChanceText();
            updateLevelsUI();
        }
        updateAllUI();
        // updateLevelsUI();
        // loginUser("Alex", "12345");

    </script>

</body>

</html>
